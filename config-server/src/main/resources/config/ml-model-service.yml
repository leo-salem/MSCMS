spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ML:ml-model-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
server:
  port: 8088
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  servers:
    - url: http://localhost:8080
      description: API Gateway
    - url: http://localhost:8088
      description: ML Model (direct)

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

app:
  ml:
    kafka:
      match-events-topic: match-events
      player-events-topic: player-events
      listeners-enabled: ${APP_ML_KAFKA_LISTENERS_ENABLED:true}
    seed:
      enabled: ${APP_ML_SEED_ENABLED:false}
      match-features-resource: classpath:data/ml_match_features_seed.json
      player-features-resource: classpath:data/ml_player_features_seed.json

logging:
  level:
    root: INFO
