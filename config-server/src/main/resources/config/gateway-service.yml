spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/mscms/protocol/openid-connect/certs
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-management-service
            uri: lb://USER-MANAGEMENT-SERVICE
            predicates:
              - Path=/users/**,/team-managers/**,/staff/**,/sport-managers/**,/sponsors/**,/scouts/**,/players/**,/national-teams/**,/fans/**
          - id: player-management-service
            uri: lb://PLAYER-MANAGEMENT-SERVICE
            predicates:
              - Path=/teams/**,/sports/**,/rosters/**,/outer-players/**,/outer-teams/**,/player-contracts/**,/player-transfers-incoming/**,/player-transfers-outgoing/**,/player-callups/**
          - id: training-match-service
            uri: lb://TRAINING-MATCH-SERVICE
            predicates:
              - Path=/matches/**,/match-events/**,/match-formations/**,/match-lineups/**,/match-performance-reviews/**,/player-match-statistics/**,/training-sessions/**,/training-plans/**,/training-drills/**,/training-attendance/**,/player-training-assessments/**
          - id: medical-fitness-service
            uri: lb://MEDICAL-FITNESS-SERVICE
            predicates:
              - Path=/injuries/**,/diagnoses/**,/treatments/**,/rehabilitations/**,/fitness-tests/**,/training-loads/**,/recovery-programs/**
          - id: notification-mail-service
            uri: lb://NOTIFICATION-MAIL-SERVICE
            predicates:
              - Path=/notifications/**,/alerts/**,/messages/**
          - id: ml-model-service
            uri: lb://ML-MODEL-SERVICE
            predicates:
              - Path=/ml/**
          - id: reports-analytics-service
            uri: lb://REPORTS-ANALYTICS-SERVICE
            predicates:
              - Path=/match-analyses/**,/player-analytics/**,/scout-reports/**,/sponsor-offers/**,/team-analytics/**,/training-analytics/**
          - id: wallet-service
            uri: lb://WALLET-SERVICE
            predicates:
              - Path=/wallets/**
          - id: payment-service
            uri: lb://PAYMENT-SERVICE
            predicates:
              - Path=/payments/**,/webhooks/**
          - id: store-service
            uri: lb://STORE-SERVICE
            predicates:
              - Path=/products/**,/orders/**,/auctions/**,/bids/**,/donations/**
          - id: user-management-api-docs
            uri: lb://USER-MANAGEMENT-SERVICE
            predicates:
              - Path=/user-management/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: player-management-api-docs
            uri: lb://PLAYER-MANAGEMENT-SERVICE
            predicates:
              - Path=/player-management/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: training-match-api-docs
            uri: lb://TRAINING-MATCH-SERVICE
            predicates:
              - Path=/training-match/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: medical-fitness-api-docs
            uri: lb://MEDICAL-FITNESS-SERVICE
            predicates:
              - Path=/medical-fitness/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: notification-mail-api-docs
            uri: lb://NOTIFICATION-MAIL-SERVICE
            predicates:
              - Path=/notification-mail/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: ml-model-api-docs
            uri: lb://ML-MODEL-SERVICE
            predicates:
              - Path=/ml-model/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: reports-analytics-api-docs
            uri: lb://REPORTS-ANALYTICS-SERVICE
            predicates:
              - Path=/reports-analytics/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: wallet-api-docs
            uri: lb://WALLET-SERVICE
            predicates:
              - Path=/wallet/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: payment-api-docs
            uri: lb://PAYMENT-SERVICE
            predicates:
              - Path=/payment/v3/api-docs/**
            filters:
              - StripPrefix=1
          - id: store-api-docs
            uri: lb://STORE-SERVICE
            predicates:
              - Path=/store/v3/api-docs/**
            filters:
              - StripPrefix=1

springdoc:
  swagger-ui:
    urls:
      - name: Gateway (Auth)
        url: /v3/api-docs
      - name: User Management
        url: /user-management/v3/api-docs
      - name: Player Management
        url: /player-management/v3/api-docs
      - name: Training & Match
        url: /training-match/v3/api-docs
      - name: Medical & Fitness
        url: /medical-fitness/v3/api-docs
      - name: Notification & Mail
        url: /notification-mail/v3/api-docs
      - name: ML Model
        url: /ml-model/v3/api-docs
      - name: Reports & Analytics
        url: /reports-analytics/v3/api-docs
      - name: Wallet
        url: /wallet/v3/api-docs
      - name: Payment
        url: /payment/v3/api-docs
      - name: Store
        url: /store/v3/api-docs

keycloak:
  auth:
    server-url: http://keycloak:8080
    realm: mscms
    client-id: mscms-frontend
    admin-username: admin
    admin-password: admin123

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

# ============================================================
# Rate limiting (Bucket4j, in-memory Caffeine cache)
# Each filter has its own bucket; multiple filters can match the
# same URL — the stricter limit kicks in first.
# Response on 429: JSON body + X-Rate-Limit-Remaining header.
# ============================================================
bucket4j:
  enabled: true
  filter-config-caching-enabled: true
  filters:
    # 1) Auth brute-force protection — per IP, strict
    - id: rl-auth
      cache-name: rl-cache
      filter-method: servlet
      filter-order: 50
      url: ^/auth/(login|signup|refresh)$
      strategy: first
      http-response-body: '{"success":false,"message":"Too many authentication attempts. Try again in a minute.","status":429}'
      http-content-type: application/json
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - id: rl-auth-bw
              capacity: 10
              time: 1
              unit: minutes

    # 2) Payment-provider webhooks (Stripe) — per IP, generous
    - id: rl-webhooks
      cache-name: rl-cache
      filter-method: servlet
      filter-order: 50
      url: ^/webhooks/.*
      strategy: first
      http-response-body: '{"error":"rate_limited","status":429}'
      http-content-type: application/json
      rate-limits:
        - cache-key: "getRemoteAddr()"
          bandwidths:
            - id: rl-webhook-bw
              capacity: 200
              time: 1
              unit: minutes

    # 3) Sensitive financial endpoints — per JWT, moderate
    - id: rl-financial
      cache-name: rl-cache
      filter-method: servlet
      filter-order: 50
      url: ^/(payments/charge|auctions/[^/]+/bids|donations(/.*)?|orders(/.*)?)$
      strategy: first
      http-response-body: '{"success":false,"message":"Rate limit exceeded for this operation. Please slow down.","status":429}'
      http-content-type: application/json
      rate-limits:
        - cache-key: "getHeader('Authorization')"
          execute-condition: "getHeader('Authorization') != null"
          bandwidths:
            - id: rl-financial-bw
              capacity: 30
              time: 1
              unit: minutes

    # 4) Default — per JWT for authenticated, per IP for anonymous.
    #    Excludes long-running SSE stream and Swagger/actuator paths.
    - id: rl-default
      cache-name: rl-cache
      filter-method: servlet
      filter-order: 100
      url: ^/(?!actuator|v3/api-docs|swagger-ui|swagger-resources|webjars|api-docs|webhooks|.*/v3/api-docs|auctions/[^/]+/stream).+
      strategy: first
      http-response-body: '{"success":false,"message":"Rate limit exceeded. Please try again later.","status":429}'
      http-content-type: application/json
      rate-limits:
        - cache-key: "getHeader('Authorization') != null ? getHeader('Authorization') : getRemoteAddr()"
          bandwidths:
            - id: rl-default-bw
              capacity: 300
              time: 1
              unit: minutes
