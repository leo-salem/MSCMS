spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/mscms/protocol/openid-connect/certs

server:
  port: 8090
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  servers:
    - url: http://localhost:8080
      description: API Gateway
    - url: http://localhost:8090
      description: Payment Service (direct)

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

mscms:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:change-me-in-prod-32-chars-min-abcdefghijk}
  payment:
    provider: ${PAYMENT_PROVIDER:STRIPE}
    success-url: ${PAYMENT_SUCCESS_URL:http://localhost:4200/wallet/charge/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:4200/wallet/charge/cancel}
    session-expiry-minutes: 30
    minimum-charge-amount: 1.00
    maximum-charge-amount: 10000.00
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
    currency: ${STRIPE_CURRENCY:usd}
