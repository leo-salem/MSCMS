spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/mscms/protocol/openid-connect/certs

server:
  port: 8091
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  servers:
    - url: http://localhost:8080
      description: API Gateway
    - url: http://localhost:8091
      description: Store Service (direct)

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

mscms:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:change-me-in-prod-32-chars-min-abcdefghijk}
  store:
    currency: ${STORE_CURRENCY:USD}
    minimum-bid-increment: ${MIN_BID_INCREMENT:1.00}
    auction-end-grace-seconds: 5
    sse-heartbeat-seconds: 25
  scheduling:
    auction-finalizer-cron: "*/10 * * * * *"
