services:
  # --- Infrastructure ---
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: embarkx
      POSTGRES_PASSWORD: embarkx
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embarkx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mscms-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mscms-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    networks:
      - mscms-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    command: [ "start-dev", "--import-realm" ]
    volumes:
      - ./keycloak/mscms-realm.json:/opt/keycloak/data/import/mscms-realm.json
    ports:
      - "8443:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo done"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mscms-network

  eureka-server:
    image: ghcr.io/tefaa1/mscms/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mscms-network

  config-server:
    image: ghcr.io/tefaa1/mscms/config-server:latest
    container_name: config-server
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mscms-network

  gateway-service:
    image: ghcr.io/tefaa1/mscms/gateway-service:latest
    container_name: gateway-service
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - mscms-network

  # --- Microservices ---
  user-management-service:
    image: ghcr.io/tefaa1/mscms/user-management-service:latest
    container_name: user-management-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_user
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin123
      - APP_ADMIN_KEYCLOAK_ID=00000000-0000-0000-0000-000000000001
      - APP_ADMIN_FIRST_NAME=Admin
      - APP_ADMIN_LAST_NAME=User
      - APP_ADMIN_USERNAME=admin
      - APP_ADMIN_EMAIL=admin@mscms.com
      - APP_ADMIN_PASSWORD=admin123
      - APP_ADMIN_PHONE=0000000000
      - APP_ADMIN_AGE=30
      - APP_ADMIN_GENDER=MALE
      - APP_ADMIN_ADDRESS=System
      - APP_ADMIN_BLOOD_TYPE=O_POSITIVE
      - APP_ADMIN_ROLE=ADMIN
      - APP_ADMIN_CREATE_DEFAULT=true
      - APP_SEED_ENABLED=true
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - mscms-network

  player-management-service:
    image: ghcr.io/tefaa1/mscms/player-management-service:latest
    container_name: player-management-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_player
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - APP_SEED_ENABLED=true
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mscms-network

  training-match-service:
    image: ghcr.io/tefaa1/mscms/training-match-service:latest
    container_name: training-match-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_training
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - APP_SEED_ENABLED=true
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mscms-network

  medical-fitness-service:
    image: ghcr.io/tefaa1/mscms/medical-fitness-service:latest
    container_name: medical-fitness-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_medical
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - APP_SEED_ENABLED=true
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mscms-network

  notification-mail-service:
    image: ghcr.io/tefaa1/mscms/notification-mail-service:latest
    container_name: notification-mail-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_notification
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - mscms-network

  reports-analytics-service:
    image: ghcr.io/tefaa1/mscms/reports-analytics-service:latest
    container_name: reports-analytics-service
    restart: on-failure
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8082
      - DB_URI=jdbc:postgresql://postgres:5432/mscms_reports
      - DB_USER=embarkx
      - DB_PASSWORD=embarkx
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - APP_SEED_ENABLED=true
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mscms-network

  ml-model-service:
    image: ${DOCKER_REGISTRY:-ghcr.io/tefaa1/mscms}/ml-model-service:${ML_MODEL_TAG:-latest}
    container_name: ml-model-service
    restart: on-failure
    ports:
      - "${ML_MODEL_PORT:-8088}:8088"
    environment:
      - SPRING_CONFIG_IMPORT=${SPRING_CONFIG_IMPORT:-optional:configserver:http://config-server:8082}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - DB_URI=${ML_DB_URI:-jdbc:postgresql://postgres:5432/mscms_ml}
      - DB_USER=${DB_USER:-embarkx}
      - DB_PASSWORD=${DB_PASSWORD:-embarkx}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_CONSUMER_GROUP_ML=${KAFKA_CONSUMER_GROUP_ML:-ml-model-service}
      - APP_ML_SEED_ENABLED=${APP_ML_SEED_ENABLED:-false}
      - APP_ML_KAFKA_LISTENERS_ENABLED=${APP_ML_KAFKA_LISTENERS_ENABLED:-true}
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - mscms-network

networks:
  mscms-network:
    driver: bridge
