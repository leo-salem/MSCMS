spring:
  datasource:
    url: jdbc:h2:mem:mltest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  test:
    database:
      replace: none
  cloud:
    config:
      enabled: false

app:
  ml:
    seed:
      enabled: false
    kafka:
      listeners-enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    org.hibernate: warn
